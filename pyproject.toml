[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probgraph"
version = "0.1.0.dev0"
description = "Discrete directed probabilistic graphical models, built from first principles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/probgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Allow mathematical Unicode (⊥, –, ≈) in strings, docstrings and comments.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["probgraph"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
