[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "probgraph"
dynamic = ["version"]
description = "Discrete probabilistic graphical models, built from first principles."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Padraig O'Brien" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
keywords = ["bayesian-network", "graphical-models", "probability", "sampling", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.version]
path = "src/probgraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/probgraph"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
# Specs contain interface sketches (`def f(...) -> T: ...`), not runnable code.
extend-exclude = ["docs/specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Allow mathematical Unicode (⊥, –, ≈) in strings, docstrings and comments.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["probgraph"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
