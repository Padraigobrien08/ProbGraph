[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probgraph"
version = "0.1.0.dev0"
description = "Discrete directed probabilistic graphical models, built from first principles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/probgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
